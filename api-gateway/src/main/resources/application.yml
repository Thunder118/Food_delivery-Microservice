server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      discovery:
        locator:
          lower-case-service-id: true
          enabled: true

      routes:
        - id: restaurant-service-route
          uri: lb://RESTAURANT-SERVICE
          predicates:
            - Path=/public/restaurants/**

        - id: driver-service-route
          uri: lb://DRIVER-SERVICE
          predicates:
            - Path=/public/drivers/**

        - id: order-service-route
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/public/orders/**

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://openzipkin:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true