version: '3.8'

services:

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: M2m2
      POSTGRES_PASSWORD: M2m4
      POSTGRES_DB: food_delivery_db
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  openzipkin:
    image: openzipkin/zipkin:latest
    container_name: openzipkin
    ports:
      - "9411:9411"

  discovery-server:
    build: ./discovery-server
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    container_name: discovery-server
    ports:
      - "8761:8761"

  order-service:
    build: ./order
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    container_name: order-service
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/food_delivery_db
      SPRING_DATASOURCE_USERNAME: M2m2
      SPRING_DATASOURCE_PASSWORD: M2m4
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://openzipkin:9411/api/v2/spans
    depends_on:
      - postgres-db
      - kafka
      - openzipkin
      - discovery-server

  restaurant-service:
    build: ./restaurant
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    container_name: restaurant-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/food_delivery_db
      SPRING_DATASOURCE_USERNAME: M2m2
      SPRING_DATASOURCE_PASSWORD: M2m4
      SPRING_DATA_REDIS_HOST: redis
      SPRING_REDIS_HOST: redis
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://openzipkin:9411/api/v2/spans
    depends_on:
      - postgres-db
      - redis
      - openzipkin
      - discovery-server

  driver-service:
    build: ./driver
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    container_name: driver-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/food_delivery_db
      SPRING_DATASOURCE_USERNAME: M2m2
      SPRING_DATASOURCE_PASSWORD: M2m4
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://openzipkin:9411/api/v2/spans
    depends_on:
      - postgres-db
      - kafka
      - openzipkin
      - discovery-server

  api-gateway:
    build: ./api-gateway
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    container_name: api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://openzipkin:9411/api/v2/spans
    depends_on:
      - discovery-server
      - order-service
      - restaurant-service
      - driver-service