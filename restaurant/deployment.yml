apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service-deployment
spec:
  replicas: 3 # Menjalankan 3 instansi sekaligus
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      containers:
        - name: restaurant-service
          image: restaurant-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081